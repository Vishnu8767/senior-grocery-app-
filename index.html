<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElderCart - Easy Grocery Shopping</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for recognizable icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- Header / Navigation -->
    <header class="bg-blue-800 text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold"><i class="fa-solid fa-basket-shopping mr-2"></i>ElderCart</h1>
            <button class="bg-red-600 hover:bg-red-700 text-white text-xl font-bold py-2 px-4 rounded-lg flex items-center border-2 border-white shadow-md">
                <i class="fa-solid fa-phone mr-2"></i> Call Help
            </button>
        </div>
        
        <!-- Search Bar with Voice -->
        <div class="max-w-4xl mx-auto mt-6 flex gap-2">
            <input type="text" placeholder="What groceries do you need?" 
                class="w-full text-2xl p-4 rounded-lg text-black border-4 border-transparent focus:border-yellow-400 outline-none shadow-inner">
            <button class="bg-green-600 hover:bg-green-700 text-white p-4 rounded-lg text-3xl shadow-md" aria-label="Voice Search">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 mt-4 mb-24">
        
        <h2 class="text-4xl font-extrabold mb-6 text-gray-800 border-b-4 border-blue-800 pb-2">Categories</h2>
        
        <!-- Category Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-md text-center cursor-pointer border-2 border-gray-200 hover:border-blue-600 transition">
                <i class="fa-solid fa-apple-whole text-5xl text-red-500 mb-4"></i>
                <h3 class="text-2xl font-bold">Fruits</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md text-center cursor-pointer border-2 border-gray-200 hover:border-blue-600 transition">
                <i class="fa-solid fa-carrot text-5xl text-orange-500 mb-4"></i>
                <h3 class="text-2xl font-bold">Veggies</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md text-center cursor-pointer border-2 border-gray-200 hover:border-blue-600 transition">
                <i class="fa-solid fa-glass-water text-5xl text-blue-400 mb-4"></i>
                <h3 class="text-2xl font-bold">Dairy</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md text-center cursor-pointer border-2 border-gray-200 hover:border-blue-600 transition">
                <i class="fa-solid fa-pills text-5xl text-purple-500 mb-4"></i>
                <h3 class="text-2xl font-bold">Pharmacy</h3>
            </div>
        </div>

        <h2 class="text-4xl font-extrabold mt-12 mb-6 text-gray-800 border-b-4 border-blue-800 pb-2">Popular Items</h2>

        <!-- Product List -->
        <div class="space-y-6" id="product-list">
            <!-- Product Item -->
            <div class="bg-white p-4 rounded-xl shadow-md flex items-center justify-between border-2 border-gray-200">
                <div class="flex items-center gap-4">
                    <div class="w-24 h-24 bg-gray-200 rounded-lg flex items-center justify-center text-4xl">🍞</div>
                    <div>
                        <h3 class="text-3xl font-bold text-gray-900">Whole Wheat Bread</h3>
                        <p class="text-2xl text-green-700 font-bold mt-1">$3.50</p>
                    </div>
                </div>
                <button onclick="addToCart()" class="bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-3 px-6 rounded-lg shadow-md">
                    + Add
                </button>
            </div>

            <!-- Product Item -->
            <div class="bg-white p-4 rounded-xl shadow-md flex items-center justify-between border-2 border-gray-200">
                <div class="flex items-center gap-4">
                    <div class="w-24 h-24 bg-gray-200 rounded-lg flex items-center justify-center text-4xl">🍌</div>
                    <div>
                        <h3 class="text-3xl font-bold text-gray-900">Fresh Bananas</h3>
                        <p class="text-2xl text-green-700 font-bold mt-1">$1.20</p>
                    </div>
                </div>
                <button onclick="addToCart()" class="bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-3 px-6 rounded-lg shadow-md">
                    + Add
                </button>
            </div>
        </div>
    </main>

    <!-- Floating Checkout Bar -->
    <div class="fixed bottom-0 w-full bg-yellow-400 p-4 shadow-2xl border-t-4 border-yellow-500">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="text-2xl font-bold text-gray-900">
                Total: <span id="cart-total" class="text-3xl">$0.00</span>
                <p class="text-lg font-medium text-gray-700" id="item-count">0 items in cart</p>
            </div>
            <button class="bg-black hover:bg-gray-800 text-white text-2xl font-bold py-4 px-8 rounded-xl shadow-lg flex items-center">
                Checkout <i class="fa-solid fa-arrow-right ml-3"></i>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
